name: Reproducing JSS Examples via Github Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker-examples:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker R image
        run: |
          docker build -t stochtree-r -f Dockerfile-R . 

      - name: Build Docker Python image
        run: |
          docker build -t stochtree-python -f Dockerfile-Python . 

      - name: Clear plots from the figures/ directory
        run: |
          rm ${{ github.workspace }}/figures/Python/*.pdf
          rm ${{ github.workspace }}/figures/R/*.pdf

      - name: Run R demo script(s)
        run: |
          docker run --rm -v $(pwd):/workspace stochtree-r Rscript scripts/replication_script.R

      - name: Run Python demo script(s)
        run: |
          docker run --rm -v $(pwd):/workspace stochtree-python python scripts/replication_script.py

      - name: Store output plots as run artifact for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: jss-plots
          path: figures/
          retention-days: 7
